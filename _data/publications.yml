  abstract: "As the prevalence of IoT devices increases, the need for strengthening security becomes inevitable. Lightweight encryption solutions play a pivotal role, particularly in addressing security concerns associated with IoT authentication and privacy. This study concentrates on the performance evaluation of open-source and lightweight encryption libraries. Various open-source encryption libraries underwent testing on a Raspberry Pi, revealing noteworthy variations in key generation, signing, verification times, and memory usage. This research provides comprehensive assistance for the selection of encryption libraries for IoT applications. Consideration extends beyond library performance, encompassing factors such as user base and documentation quality, to deliver optimal security solutions."

- id: Ertem_2024_JIENS
