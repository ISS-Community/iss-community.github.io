  title: "Siber Ağların Risk Analizi: Saldırı-Savunma Ağaçlarıyla Temellendirilmiş Niceliksel Bir Yaklaşım"
  journal: "Journal of Innovative Engineering and Natural Science"
  citation: "4(1), 113-125"
  year: 2024
  url: "https://dergipark.org.tr/en/pub/jiens/issue/80576/1380821"
  abstract: "With the rapid increase in cyber-attacks and potential damage in today's world, ensuring cybersecurity has become of paramount importance for companies and organizations. In this study, an approach based on attack-defense trees has been developed for the quantitative analysis of cyber risks. The proposed methodology utilizes attack-defense trees to measure the risk levels of nodes representing cyber threats and systematically calculate the total risk when specific defense measures are implemented. The developed cyber risk analysis approach has been applied to a common scenario involving phishing attacks, and cyber risk values have been calculated under various defense strategies. For instance, when no defense measures are taken, the cyber risk value is calculated as 0.28392. However, when technical defense measures such as antivirus software, intrusion detection systems (IDS), access control, web content filtering, and spam control are implemented, the risk value significantly decreases by approximately 97.5% to 0.00721. Furthermore, incorporating user training results in a 98% reduction in risk value. Implementing basic defense measures targeting individual users, such as antivirus and spam control, leads to a reduction of around 90% in the risk value. The accuracy and significance of the proposed approach are demonstrated through the results obtained from this sample study. The contributions of the developed approach to determining cybersecurity strategies are detailed in the discussion section."

- id: Degirmenci_2022_ISCTurkey
  date: 2022-10-19
  pmid: null
