  title: "BEATS: Practical Audit Trail in Blockchain Systems"
  journal: "IEEE Access"
  citation: "2025, 13, 38120-38135"
  year: 2025
  url: "https://doi.org/10.1109/ACCESS.2025.3582722"
  abstract: "BEATS introduces a lightweight and scalable audit trail architecture for enterprise blockchain systems. By combining cryptographic proofs with optimized accumulator structures, it provides verifiable log immutability with minimal storage overhead and low verification latency."

