- id: Ozcelik_2025_ISMSIT_Accumulator
  date: 2025-11-14
  pmid: null
  pmcid: null
  authors:
    - Özçelik İ
  title: "A Code-Based Universal Cryptographic Accumulator"
  journal: "2025 9th International Symposium on Multidisciplinary Studies and Innovative Technologies (ISMSIT)"
  citation: "pp. 1-5"
  year: 2025
  url: "https://ieeexplore.ieee.org/document/11268188"
  abstract: "In computer science and engineering, set membership tests are of critical importance in numerous areas, such as databases and verification systems. Traditional search algorithms become inefficient in terms of time and memory as the set size increases. To overcome these limitations, cryptographic accumulators, which are specialized data structures that perform set membership tests efficiently, have been proposed. Accumulators compress the values of a large set into a small value, offering the ability to effectively prove the existence of set elements. Cryptographic accumulators play an effective role in solving various problems such as privacy-preserving data sharing, verification of data integrity, and particularly authentication in areas like identity verification systems, blockchain, and pattern matching."

