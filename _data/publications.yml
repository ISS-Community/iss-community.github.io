  title: "IP Spoofing Detection Using Deep Learning"
  journal: "Applied Sciences"
  citation: "15(17), 9508"
  year: 2025
  url: "https://www.mdpi.com/2076-3417/15/17/9508"
  abstract: "IP spoofing is a critical component in many cyberattacks, enabling attackers to evade detection and conceal their identities. This study rigorously compares eight deep learning models—LSTM, GRU, CNN, MLP, DNN, RNN, ResNet1D, and xLSTM—for their efficacy in detecting IP spoofing attacks. Overfitting was mitigated through techniques such as dropout, early stopping, and normalization. Models were trained using binary cross-entropy loss and the Adam optimizer. Performance was assessed via accuracy, precision, recall, F1 score, and inference time, with each model executed a total of 15 times to account for stochastic variability. Results indicate a powerful performance across all models, with LSTM and GRU demonstrating superior detection efficacy. After ONNX conversion, the MLP and DNN models retained their performance while achieving significant reductions in inference time, miniaturized model sizes, and platform independence. These advancements facilitated the effective utilization of the developed systems in real-time network security applications. The comprehensive performance metrics presented are crucial for selecting optimal IP spoofing detection strategies tailored to diverse application requirements, serving as a valuable reference for network anomaly monitoring and targeted attack detection."

- id: Alagha_2025_BEATS
  date: 2025-06-24
  pmid: null
  pmcid: null
  authors:
    - Alagha B
    - Özçelik İ
  title: "BEATS: Practical Audit Trail in Blockchain Systems"
  journal: "IEEE Access"
  citation: "Vol. 13, pp. 109657-109669"
  year: 2025
  url: "https://ieeexplore.ieee.org/document/11048856"
  abstract: "An audit trail records activities and tracks changes within a system, serving as a crucial tool for fraud prevention and data management. However, traditional audit trail systems often face inefficiencies, high costs, and vulnerability to security breaches and unauthorized access, limiting their real-time fraud detection capabilities. These limitations highlight the need for more reliable, secure, and efficient solutions. Blockchain technology, with its decentralized and immutable ledger, provides a promising solution. By providing tamper-proof, transparent, and real-time transaction records, blockchain enhances the reliability, efficiency, and security of audit trails, transforming auditing practices and boosting stakeholder trust. Despite these advantages, a significant challenge remains: as transaction volumes grow, retrieving and verifying specific information becomes increasingly time-consuming and resource-intensive. This problem, often overlooked in research, restricts the scalability and practicality of blockchain-based audit systems. To address these limitations, this study proposes BEATS (Blockchain-based Efficient Audit Trail System) - an efficient approach for verifying specific information within a blockchain. BEATS leverages a Cryptographic Accumulator, a compact data structure that accumulates transaction hashes, enabling auditors to verify transaction authenticity without exhaustive searches or supplementary systems. Our evaluation on the Sawtooth platform compared BEATS against linear transaction search, database-supported search, and platform-specific solutions. Results demonstrate that the RSA-based Cryptographic Accumulator significantly improves verification efficiency, achieving O(1) time and space complexity. This research shows that BEATS enhances the practicality and scalability of blockchain-based audit trail systems for large-scale applications, advancing blockchain technology adoption in domains that demand secure, efficient, and scalable audit solutions."

