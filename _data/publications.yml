  authors:
    - Eren S
    - Gültekin A
    - Özkan Ö
    - Özçelik İ
  title: "High-Throughput and Low-Latency DrDoS Detection Using Quantized ONNX Models"
  journal: "Symmetry"
  citation: "2026, 18(7), 1187"
  year: 2026
  url: "https://doi.org/10.3390/sym18071187"
  abstract: "This study presents a high-throughput, ultra-low-latency Distributed Reflection Denial of Service (DrDoS) detection architecture using quantized ONNX neural network models. By systematically comparing optimization and integer quantization configurations, the framework delivers high-precision detection against DNS Amplification and volumetric reflection attacks with microsecond inference times on resource-constrained platforms."

