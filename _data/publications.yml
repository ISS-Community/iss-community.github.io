  title: "Performance Evaluation of ECC Based Cryptographic Accumulator on Resource-Constrained Platform"
  journal: "2024 Innovations in Intelligent Systems and Applications Conference (ASYU)"
  citation: "pp. 1-6"
  year: 2024
  url: "https://ieeexplore.ieee.org/document/10757120"
  abstract: "Cryptographic accumulators are efficient data structures used for membership testing in various applications, including resource-constrained devices like IoT systems. This paper explores the performance of an ECC-based dynamic cryptographic accumulator implemented on a Raspberry Pi. The study focuses on evaluating key functions (verification, witness generation, and insertion) essential for IoT environments with limited computational resources. The research finds that witness generation operates with O(n) complexity, highlighting the importance of considering element ID lengths to maintain efficiency. Batch insertion strategies demonstrate nearly O (1) complexity, significantly reducing overhead compared to individual insertions and crucial for minimizing operational delays in IoT deployments. Verification functions consistently operate in O (1) time, making them suitable for real-time IoT applications with minimal memory requirements. Empirical results demonstrate the feasibility of cryptographic accumulators in low-energy systems, emphasizing their potential to enhance data integrity and confidentiality in IoT environments. Future research should explore additive-based accumulator schemes to further optimize performance and reduce processing demands. This study provides empirical insights into adapting cryptographic accumulators for IoT devices, offering practical guidance on selecting suitable accumulator schemes and optimizing performance metrics critical for deploying secure and efficient IoT applications.)"

