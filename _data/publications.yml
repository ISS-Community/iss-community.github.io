    - Özçelik İ
  title: "Botnet Node Detection Using Graph Learning"
  journal: "Applied Sciences"
  citation: "2025, 16(1), 24"
  year: 2025
  url: "https://doi.org/10.3390/app16010024"
  abstract: "This study presents a graph neural network-based method for detecting botnet nodes in complex communication topologies. By modeling host interactions as graph structures, the framework identifies malicious command-and-control communication with high precision even in obfuscated network flows."

