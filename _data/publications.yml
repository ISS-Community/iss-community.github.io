  title: "Flowzen: Modular and Scalable Network Monitoring Platform"
  journal: "18th International Conference on Information Security and Cryptology (ISCTurkiye 2025)"
  citation: "2025, ISCTurkiye Proceedings"
  year: 2025
  url: "https://iscturkiye.com/"
  abstract: "Flowzen presents a cloud-native, modular network monitoring platform coupling real-time stream processing with Kubernetes Horizontal Pod Autoscaling (HPA). The framework minimizes packet loss from 52% to 2.5% during high-volume bursts and provides granular telemetry for real-time security analytics in data center networks."

