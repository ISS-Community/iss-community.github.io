  citation: "1-5"
  year: 2025
  url: "https://ieeexplore.ieee.org/document/11268018"
  abstract: "Traditional authentication protocols, which rely on centralized identity providers, face significant challenges with latency and bandwidth consumption as modern information systems scale to a large number of users and real-time processing. Edge authentication offers a promising solution by shifting user verification to local devices, thereby reducing dependency on a central server. This paper proposes a novel edge authentication protocol designed for efficiency and security, particularly for resource-constrained Internet of Things (IoT) devices, by leveraging a cryptographic accumulator to provide a compact and verifiable representation of the authentication database."

