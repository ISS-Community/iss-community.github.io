  title: "IP Spoofing Detection Using Deep Learning"
  journal: "Applied Sciences"
  citation: "2025, 15(17), 9508"
  year: 2025
  url: "https://doi.org/10.3390/app15179508"
  abstract: "This study compares several deep learning models for IP spoofing detection and evaluates them with accuracy, precision, recall, F1 score, and inference time. The results highlight models that are effective for real-time network security, with an emphasis on practical deployment and platform independence."

