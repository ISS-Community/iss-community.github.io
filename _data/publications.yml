  title: "Using Blockchain Technology for Audit Trail"
  journal: "Digital Strategy and Governance in Transformative Technologies"
  citation: "CRC Press, 239-259"
  year: 2025
  url: "https://www.taylorfrancis.com/chapters/edit/10.1201/9781003477808-14/using-blockchain-technology-audit-trail-bilal-alagha-i%CC%87lker-%C3%B6z%C3%A7elik"
  abstract: "An audit trail records activities and events that track changes within a system. Maintaining a reliable audit trail prevents fraud, manages data, and ensures control. Recent audit failures highlight the need for more reliable audit trails. Traditional methods face criticism due to their susceptibility to security breaches, inefficiencies, and high costs, which limit their effectiveness in real-time fraud detection. With its decentralized and immutable ledger, blockchain technology presents a promising alternative. It provides a tamper-proof, transparent, and real-time record of transactions to enhance audit quality, reduce fraud risks, and improve auditing efficiency."

