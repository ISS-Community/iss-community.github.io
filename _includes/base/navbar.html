<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      {% if site.logo %}
        <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
      {% else %}
        <img src="{{ '/assets/images/logo/iss-logo.png' | relative_url }}" alt="ISS Lab">
      {% endif %}
      <span>ISS Lab</span>
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ml-auto">
        {% for item in site.data.base.navigation %}
          <li class="nav-item {% if page.url == item.href %}active{% endif %}">
            <a class="nav-link {% if page.url == item.href %}active{% endif %}" href="{{ item.href | relative_url }}">{{ item.text }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
