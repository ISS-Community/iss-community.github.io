<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  {% if page.layout == 'home' or page.url == '/' %}
    <title>ISS Lab</title>
  {% else %}
    <title>{{ page.title }} - ISS Lab</title>
  {% endif %}

  <!-- Favicon with cache busting -->
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/images/logo/iss-logo.png?v=18' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/logo/iss-logo.png?v=18' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/logo/iss-logo.png?v=18' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/logo/iss-logo.png?v=18' | relative_url }}">

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  {% if page.description %}
    <meta name="description" content="{{ page.description | strip_html | strip_newlines | truncate: 160 }}">
  {% elsif site.description %}
    <meta name="description" content="{{ site.description }}">
  {% endif %}

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
