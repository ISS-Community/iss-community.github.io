<div class="open-call-popup" role="dialog" aria-labelledby="open-call-popup-title" aria-describedby="open-call-popup-description">
  <button class="open-call-popup-close" type="button" aria-label="Close announcement">&times;</button>
  <div class="open-call-popup-header">
    <span class="open-call-popup-label"><i class="fa fa-bullhorn mr-1"></i> ISSLab Community</span>
    <h2 id="open-call-popup-title">Ready for real cybersecurity research?</h2>
  </div>
  <div class="open-call-popup-body">
    <p id="open-call-popup-description">
      Move beyond theory and join motivated undergraduate and graduate researchers working on real-world security challenges.
    </p>
    <div class="open-call-popup-highlights">
      <span><i class="fa fa-server"></i> Real infrastructure</span>
      <span><i class="fa fa-shield"></i> AI security</span>
      <span><i class="fa fa-graduation-cap"></i> TÜBİTAK mentorship</span>
    </div>
    <div class="open-call-popup-actions">
      <a class="btn btn-primary btn-sm" href="{{ '/community/' | relative_url }}">Explore the open call</a>
      <a class="open-call-popup-link" href="https://www.linkedin.com/feed/update/urn:li:activity:7516107911438282752/" target="_blank" rel="noopener noreferrer">LinkedIn Announcement</a>
    </div>
  </div>
</div>

<script>
  (function () {
    var popup = document.querySelector('.open-call-popup');
    var closeButton = popup && popup.querySelector('.open-call-popup-close');

    if (popup && closeButton) {
      closeButton.addEventListener('click', function () {
        popup.hidden = true;
      });
    }
  }());
</script>
